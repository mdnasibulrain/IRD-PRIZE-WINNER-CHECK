            // ANNOUNCEMENT CLICK HANDLER
            const handleAnnouncementClick = (ann) => {
                if (isAdminMode) setIsAdminMode(false);
                if (ann.productId) {
                    const foundProd = products.find(p => p.id === ann.productId);
                    if (foundProd) {
                        setActiveModalProduct(foundProd);
                        return;
                    }
                }
                if (ann.bundleId) {
                    scrollToSection('bundles');
                    return;
                }
                scrollToSection('explore');
            };

            // FILTER & SORT PRODUCTS FOR CUSTOMER
            const filteredProducts = useMemo(() => {
                return products.filter(p => {
                    if (p.status === "Draft" || p.status === "Archived" || p.status === "Hidden") return false;
                    const matchesCategory = selectedCategory === "all" || p.category === selectedCategory;
                    const q = searchQuery.toLowerCase().trim();
                    const matchesSearch = !q || 
                        p.title.toLowerCase().includes(q) ||
                        p.subtitle.toLowerCase().includes(q) ||
                        (p.summary && p.summary.toLowerCase().includes(q)) ||
                        (p.tags && Array.isArray(p.tags) && p.tags.some(t => t.toLowerCase().includes(q)));
                    return matchesCategory && matchesSearch;
                }).sort((a, b) => {
                    const priceA = a.pricing?.salePrice || a.salePrice || 0;
                    const priceB = b.pricing?.salePrice || b.salePrice || 0;
                    const regA = a.pricing?.regularPrice || a.regularPrice || 0;
                    const regB = b.pricing?.regularPrice || b.regularPrice || 0;

                    if (sortBy === "price-low") return priceA - priceB;
                    if (sortBy === "price-high") return priceB - priceA;
                    if (sortBy === "discount") return ((regB - priceB)/regB) - ((regA - priceA)/regA);
                    if (sortBy === "newest") return b.isNew ? 1 : -1;
                    return (b.isFeatured ? 1 : 0) - (a.isFeatured ? 1 : 0);
                });
            }, [products, selectedCategory, searchQuery, sortBy]);

            // CART HANDLERS
            const addToCart = (item, type = "single") => {
                let cartItem;
                if (type === "single") {
                    cartItem = {
                        id: item.id,
                        title: item.title,
                        cover: item.coverImage?.source,
                        salePrice: item.pricing?.salePrice || item.salePrice,
                        regularPrice: item.pricing?.regularPrice || item.regularPrice,
                        quantity: 1,
                        type: "Ebook Single"
                    };
                } else if (type === "combo") {
                    cartItem = {
                        id: `combo-${Date.now()}`,
                        title: `Custom Combo (${item.products.length} Ebooks)`,
                        cover: item.products[0]?.coverImage?.source,
                        salePrice: item.salePrice,
                        regularPrice: item.regularPrice,
                        quantity: 1,
                        type: "Custom Combo",
                        items: item.products.map(p => p.title)
                    };
                } else if (type === "bundle") {
                    cartItem = {
                        id: item.id,
                        title: item.title,
                        cover: item.image,
                        salePrice: item.salePrice,
                        regularPrice: item.regularPrice,
                        quantity: 1,
                        type: "Curated Bundle"
                    };
                }

                setCart(prev => {
                    const existingIndex = prev.findIndex(ci => ci.id === cartItem.id);
                    if (existingIndex > -1) {
                        const updated = [...prev];
                        updated[existingIndex].quantity += 1;
                        return updated;
                    }
                    return [...prev, cartItem];
                });

                showToast(`"${cartItem.title}" Cart मा थपियो!`);
            };

            const removeFromCart = (id) => {
                setCart(prev => prev.filter(item => item.id !== id));
            };

            const updateCartQuantity = (id, delta) => {
                setCart(prev => prev.map(item => {
                    if (item.id === id) {
                        const newQ = item.quantity + delta;
                        return newQ > 0 ? { ...item, quantity: newQ } : item;
                    }
                    return item;
                }));
            };

            const cartTotals = useMemo(() => {
                const subtotal = cart.reduce((acc, item) => acc + (item.regularPrice * item.quantity), 0);
                const finalTotal = cart.reduce((acc, item) => acc + (item.salePrice * item.quantity), 0);
                const savings = subtotal - finalTotal;
                const count = cart.reduce((acc, item) => acc + item.quantity, 0);
                return { subtotal, finalTotal, savings, count };
            }, [cart]);

            // COMBO COMPUTATION
            const comboCalculation = useMemo(() => {
                const selectedObjs = products.filter(p => comboSelectedIds.includes(p.id));
                const regTotal = selectedObjs.reduce((acc, p) => acc + (p.pricing?.regularPrice || p.regularPrice || 0), 0);
                const saleTotal = selectedObjs.reduce((acc, p) => acc + (p.pricing?.salePrice || p.salePrice || 0), 0);
                let bonusDiscount = 0;
                if (selectedObjs.length >= 2) {
                    bonusDiscount = Math.round(saleTotal * 0.15);
                }
                const finalComboPrice = saleTotal - bonusDiscount;
                const totalSavings = regTotal - finalComboPrice;

                return {
                    selectedObjs,
                    regTotal,
                    finalComboPrice,
                    totalSavings
                };
            }, [comboSelectedIds, products]);

            };

                setIsAdminAuthenticated(false);

            const startEditProduct = (prod) => {
                setEditingProductId(prod.id);
                setProductForm({
                    id: prod.id,
                    slug: prod.slug || prod.id,
                    category: prod.category || "computer-skills",

                    subtitle: prod.subtitle || "",
                    summary: prod.summary || "",
                    description: prod.description || "",
                    coverImage: prod.coverImage || { type: "image", source: "https://placehold.co/600x800/0f172a/f59e0b?text=Cover" },
                    galleryImages: prod.galleryImages || [],
                    previewPdf: prod.previewPdf || null,

                    chapters: prod.chapters || 10,

                                <h5 className="font-bold text-white text-sm mb-3">Disclaimers & Policies</h5>
                                <div className="space-y-2 text-[11px] text-slate-400">
                                    <button onClick={() => setPolicyModalContent({ title: "Privacy Policy", content: "हामी तपाईंको सम्पर्क विवरण र गोपनीयताको पूर्ण सम्मान गर्छौं। कुनै पनि व्यक्तिगत डेटा तेस्रो पक्षलाई बिक्री वा सेयर गरिँदैन।" })} className="block hover:text-amber-400 underline">Privacy Policy</button>
                                    <button onClick={() => setPolicyModalContent({ title: "Terms & Conditions", content: "Ebooks केवल व्यक्तिगत अध्ययनका लागि हुन्। प्रतिलिपि अधिकार सुरक्षित छ। अनधिकृत पुनःबिक्री मनाही छ।" })} className="block hover:text-amber-400 underline">Terms & Conditions</button>
                                    <button onClick={() => setPolicyModalContent({ title: "Educational Disclaimer", content: "सामग्री अध्ययन र ज्ञान साक्षरताका लागि हो। यसले शतप्रतिशत रोजगारी वा निश्चित आम्दानीको ग्यारेन्टी गर्दैन।" })} className="block hover:text-amber-400 underline">Educational Disclaimer</button>
                                    <button onClick={() => setIsAdminMode(true)} className="block text-amber-500 font-bold hover:underline mt-2">⚙️ Product Manager Login</button>
                                </div>
                            </div>
                        </div>

                        <div className="max-w-7xl mx-auto px-4 mt-8 pt-4 border-t border-slate-800 text-center text-[11px] text-slate-500">
                            © {new Date().getFullYear()} {BRAND_CONFIG.storeName}. All rights reserved.
                        </div>
                    </footer>

                    {/* 14. SHOPPING CART DRAWER */}
                    {isCartOpen && (
                        <div className="fixed inset-0 z-50 flex justify-end bg-slate-900/60 backdrop-blur-xs">
                            <div className="w-full max-w-md bg-white h-full shadow-2xl flex flex-col justify-between p-6 overflow-y-auto">
                                <div>
                                    <div className="flex items-center justify-between border-b border-slate-100 pb-4">
                                        <h3 className="font-black text-lg text-slate-900">🛒 Your Shopping Cart</h3>
                                        <button 
                                            onClick={() => setIsCartOpen(false)}
                                            className="text-slate-400 hover:text-slate-600 text-lg font-bold"
                                        >
                                            ✕
                                        </button>
                                    </div>

                                    {cart.length === 0 ? (
                                        <div className="text-center py-16 space-y-3">
                                            <span className="text-4xl">🛒</span>
                                            <p className="text-slate-500 font-semibold text-sm">तपाईंको Cart खाली छ।</p>
                                            <button 
                                                onClick={() => { setIsCartOpen(false); scrollToSection('explore'); }}
                                                className="px-4 py-2 bg-amber-500 text-slate-950 font-bold text-xs rounded-xl"
                                            >
                                                Ebooks Browse गर्नुहोस्
                                            </button>
                                        </div>
                                    ) : (
                                        <div className="py-4 space-y-4">
                                            {cart.map(item => (
                                                <div key={item.id} className="flex items-center space-x-3 p-3 rounded-xl border border-amber-200 bg-amber-50/20">
                                                    <img src={item.cover} alt="" className="w-12 h-16 object-cover rounded shadow shrink-0" />
                                                    <div className="flex-grow">
                                                        <span className="text-[10px] font-bold text-amber-800 uppercase">{item.type}</span>
                                                        <h4 className="font-extrabold text-xs text-slate-900 line-clamp-1">{item.title}</h4>
                                                        <div className="mt-1 flex items-center justify-between">
                                                            <span className="font-black text-amber-700 text-xs">रु. {item.salePrice}</span>
                                                            <div className="flex items-center space-x-2">
                                                                <button onClick={() => updateCartQuantity(item.id, -1)} className="px-1.5 py-0.5 bg-slate-200 rounded text-xs font-bold">-</button>
                                                                <span className="text-xs font-bold">{item.quantity}</span>
                                                                <button onClick={() => updateCartQuantity(item.id, 1)} className="px-1.5 py-0.5 bg-slate-200 rounded text-xs font-bold">+</button>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <button onClick={() => removeFromCart(item.id)} className="text-red-500 hover:text-red-700 text-sm font-bold p-1">✕</button>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                {cart.length > 0 && (
                                    <div className="pt-4 border-t border-slate-200 space-y-3">
                                        <div className="space-y-1 text-xs">
                                            <div className="flex justify-between text-slate-500">
                                                <span>Subtotal:</span>
                                                <span className="line-through">रु. {cartTotals.subtotal}</span>
                                            </div>
                                            <div className="flex justify-between text-emerald-700 font-bold">
                                                <span>Total Savings:</span>
                                                <span>- रु. {cartTotals.savings}</span>
                                            </div>
                                            <div className="flex justify-between text-base font-black text-slate-900 pt-1 border-t border-slate-100">
                                                <span>Final Total:</span>
                                                <span className="text-amber-700">रु. {cartTotals.finalTotal}</span>
                                            </div>
                                        </div>

                                        <p className="text-[11px] text-slate-500 bg-amber-50 p-2 rounded border border-amber-200">
                                            ℹ️ Payment NSPAY Page मा हुनेछ। Payment पश्चात Screenshot WhatsApp (+977 9702784684) मा पठाउनुपर्छ।
                                        </p>

                                        <a 
                                            href={BRAND_CONFIG.nspayUrl} 
                                            target="_blank"
                                            rel="noreferrer"
                                            className="block w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-black text-xs text-center uppercase tracking-wider rounded-xl shadow-md transition"
                                        >
                                            NSPAY मा Payment गर्न जानुहोस् ➔
                                        </a>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* 15. MOBILE BOTTOM NAVIGATION */}
                    <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-amber-300 z-30 px-2 py-2 flex items-center justify-around shadow-lg">
                        <button onClick={() => scrollToSection('hero')} className="flex flex-col items-center text-slate-700 hover:text-amber-600">
                            <span className="text-base">🏠</span>
                            <span className="text-[10px] font-bold">HOME</span>
                        </button>
                        <button onClick={() => scrollToSection('explore')} className="flex flex-col items-center text-slate-700 hover:text-amber-600">
                            <span className="text-base">📚</span>
                            <span className="text-[10px] font-bold">EBOOKS</span>
                        </button>
                        <button onClick={() => setIsCartOpen(true)} className="flex flex-col items-center text-slate-700 hover:text-amber-600 relative">
                            <span className="text-base">🛒</span>
                            <span className="text-[10px] font-bold">CART</span>
                            {cartTotals.count > 0 && (
                                <span className="absolute -top-1 right-1 bg-amber-600 text-white font-black text-[9px] w-4 h-4 rounded-full flex items-center justify-center">
                                    {cartTotals.count}
                                </span>
                            )}
                        </button>
                        <button onClick={() => scrollToSection('combos')} className="flex flex-col items-center text-slate-700 hover:text-amber-600">
                            <span className="text-base">🎁</span>
                            <span className="text-[10px] font-bold">OFFERS</span>
                        </button>
                        <button onClick={() => setIsAdminMode(!isAdminMode)} className="flex flex-col items-center text-amber-700 hover:text-amber-900">
                            <span className="text-base">⚙️</span>
                            <span className="text-[10px] font-bold">ADMIN</span>
                        </button>
                    </nav>

                    {/* 16. PRODUCT DETAILS MODAL */}
                    {activeModalProduct && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
                            <div className="bg-white max-w-2xl w-full rounded-2xl border-2 border-amber-400 shadow-2xl max-h-[90vh] overflow-y-auto p-6 relative">
                                <button 
                                    onClick={() => setActiveModalProduct(null)}
                                    className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 font-bold text-lg"
                                >
                                    ✕
                                </button>

                                <div className="flex flex-col md:flex-row gap-6">
                                    <img 
                                        src={activeModalProduct.coverImage?.source} 
                                        alt="" 
                                        className="w-full md:w-48 h-64 object-cover rounded-xl shadow-md border border-amber-200 cursor-pointer"
                                        onClick={() => setPreviewImageAsset(activeModalProduct.coverImage?.source)}
                                    />
                                    <div className="space-y-3">
                                        <span className="bg-amber-100 text-amber-800 text-[10px] font-black px-2 py-0.5 rounded uppercase">
                                            {activeModalProduct.category}
                                        </span>
                                        <h3 className="text-xl font-extrabold text-slate-900 leading-snug">{activeModalProduct.title}</h3>
                                        <p className="text-xs text-slate-500">{activeModalProduct.subtitle}</p>

                                        <div className="flex items-center space-x-3 text-xs font-bold text-amber-800">
                                            <span>📄 {activeModalProduct.pages} Pages</span>
                                            <span>•</span>
                                            <span>📚 {activeModalProduct.chapters} Chapters</span>
                                            <span>•</span>
                                            <span>⭐ {activeModalProduct.rating}</span>
                                        </div>

                                        <div className="pt-2">
                                            <span className="text-2xl font-black text-amber-700">रु. {activeModalProduct.pricing?.salePrice || activeModalProduct.salePrice}</span>
                                            <span className="ml-2 text-xs text-slate-400 line-through">रु. {activeModalProduct.pricing?.regularPrice || activeModalProduct.regularPrice}</span>
                                        </div>

                                        <div className="flex space-x-2 pt-2">
                                            <button 
                                                onClick={() => {
                                                    setPreviewPdfAsset(activeModalProduct.previewPdf || "demo");
                                                }}
                                                className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-xs rounded-xl border border-slate-300"
                                            >
                                                📄 Preview PDF
                                            </button>
                                            <button 
                                                onClick={() => {
                                                    addToCart(activeModalProduct, "single");
                                                    setActiveModalProduct(null);
                                                }}
                                                className="px-5 py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-black text-xs rounded-xl shadow"
                                            >
                                                Cart मा थप्नुहोस् 🛒
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                {/* Chapters outline */}
                                <div className="mt-6 pt-4 border-t border-slate-100">
                                    <h4 className="font-extrabold text-sm text-slate-900 mb-3">📚 Chapter Outline</h4>
                                    <div className="space-y-2 max-h-48 overflow-y-auto pr-1">
                                        {activeModalProduct.chapterOutline?.map(ch => (
                                            <div key={ch.number} className="p-2.5 rounded-lg bg-amber-50/40 border border-amber-200/60 text-xs">
                                                <span className="font-bold text-amber-800">Chapter {ch.number}: {ch.title}</span>
                                                <p className="text-[11px] text-slate-500 mt-0.5">{ch.description}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 17. SAMPLE PDF PREVIEW MODAL */}
                    {previewPdfAsset && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-xs">
                            <div className="bg-white max-w-3xl w-full h-[80vh] rounded-2xl border-2 border-amber-400 shadow-2xl flex flex-col p-4 relative">
                                <div className="flex justify-between items-center pb-3 border-b border-slate-200">
                                    <h4 className="font-extrabold text-sm text-slate-900">📄 Sample Chapter Preview</h4>
                                    <button onClick={() => setPreviewPdfAsset(null)} className="font-bold text-slate-400 hover:text-slate-600">✕</button>
                                </div>

                                <div className="flex-grow my-4 bg-slate-100 rounded-xl overflow-hidden flex items-center justify-center">
                                    {typeof previewPdfAsset === "object" && previewPdfAsset?.source ? (
                                        <iframe src={previewPdfAsset.source} className="w-full h-full"></iframe>
                                    ) : (
                                        <div className="text-center p-6 space-y-3 max-w-md">
                                            <span className="text-4xl">📄</span>
                                            <h5 className="font-bold text-slate-800 text-sm">Sample PDF Preview</h5>
                                            <p className="text-xs text-slate-500 leading-relaxed">
                                                यहाँ यस Ebook को नमुना अध्याय प्रदर्शन गरिन्छ। सम्पूर्ण Ebook Payment पुष्टि भएपछि WhatsApp वा Email मा पठाइनेछ।
                                            </p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 18. IMAGE LIGHTBOX MODAL */}
                    {previewImageAsset && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm" onClick={() => setPreviewImageAsset(null)}>
                            <div className="max-w-xl w-full p-2 relative">
                                <img src={previewImageAsset} alt="" className="w-full h-auto rounded-2xl shadow-2xl border-2 border-amber-400" />
                                <span className="absolute top-4 right-4 text-white text-xs bg-slate-900/80 px-2 py-1 rounded cursor-pointer">✕ Close</span>
                            </div>
                        </div>
                    )}

                    {/* 19. POLICY MODAL */}
                    {policyModalContent && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60">
                            <div className="bg-white max-w-md w-full p-6 rounded-2xl border-2 border-amber-400 shadow-2xl space-y-4">
                                <h4 className="font-extrabold text-base text-slate-900">{policyModalContent.title}</h4>
                                <p className="text-xs text-slate-600 leading-relaxed">{policyModalContent.content}</p>
                                <button onClick={() => setPolicyModalContent(null)} className="w-full py-2 bg-amber-500 text-slate-950 font-bold text-xs rounded-xl">
                                    बुझें (Close)
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // RENDER APPLICATION
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
